name: drivemate
description: "DriveMate - Phone-as-a-key, AI vehicle assistant, and predictive car health monitoring."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.1
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
